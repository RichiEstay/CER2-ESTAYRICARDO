
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Patrimonio Vivo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #F5EFE5;
            color: #293D38;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #293D38;
            padding: 15px 0;
        }

        .navbar-brand {
            color: #e3a12e;
            font-size: 23px;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: #E3B79C;
        }

        .btn-menu {
            color: #F5EFE5;
            border: 1px solid #9EABA3;
            background-color: transparent;
        }

        .btn-menu:hover {
             background-color: #F5EFE5;
            color: #293D38;
        }

        .btn-gestion {
            background-color: #B65D43;
            color: white;
            border: 1px solid #B65D43;
        }

        .btn-gestion:hover {
            background-color: #944932;
            color: white;
        }

        .btn-principal {
            background-color: #B65D43;
            color: white;
            border: 1px solid #B65D43;
        }

        .btn-principal:hover {
            background-color: #944932;
            color: white;
            border-color: #944932;
        }

        .btn-secundario {
            background-color: #6D4939;
            color: rgb(0, 0, 0);
            border: 1px solid #6D4939;
        }

        .btn-secundario:hover {
            background-color: #503529;
            color: white;
        }

        .saludo {
            color: #F5EFE5;
            font-size: 14px;
        }

        .card {
            border: 1px solid #E3D6C7;
            border-radius: 8px;
        }

        .card-img-top {
            height: 210px;
            object-fit: cover;
        }

        h1, h2, h3 {
            color: #293D38;
        }

        .table {
            background-color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="{% url 'home' %}">
                Patrimonio Vivo
            </a>

            <div class="d-flex align-items-center gap-2 flex-wrap">

                <a class="btn btn-menu" href="{% url 'home' %}">
                    Inicio
                </a>

                <a class="btn btn-menu" href="{% url 'catalogo' %}">
                    Catálogo
                </a>

                {% if user.is_authenticated %}

                    <a class="btn btn-gestion" href="{% url 'gestion' %}">
                        Gestión
                    </a>

                    <span class="saludo">
                        Hola, {{ user.username }}
                    </span>

                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-secundario">
                            Cerrar sesión
                        </button>
                    </form>

                {% else %}

                    <a class="btn btn-principal" href="{% url 'login' %}">
                        Iniciar sesión
                    </a>

                {% endif %}

            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block contenido %}
        {% endblock %}
    </div>

</body>
</html>

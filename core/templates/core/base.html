<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Patrimonio Vivo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            Patrimonio Vivo
        </a>

        <div class="d-flex align-items-center gap-2">

            <a class="btn btn-outline-light" href="{% url 'home' %}">
                Inicio
            </a>

            <a class="btn btn-outline-light" href="{% url 'catalogo' %}">
                Catálogo
            </a>

            {% if user.is_authenticated %}

                <a class="btn btn-warning" href="{% url 'gestion' %}">
                    Gestión
                </a>

                <span class="text-white">
                    Hola, {{ user.username }}
                </span>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        Cerrar sesión
                    </button>
                </form>

            {% else %}

                <a class="btn btn-success" href="{% url 'login' %}">
                    Iniciar sesión
                </a>

            {% endif %}

        </div>
    </div>
</nav>

    <div class="container mt-4">
        {% block contenido %}
        {% endblock %}
    </div>

</body>
</html>
